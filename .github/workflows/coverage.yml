name: Coverage

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  coverage:
    # Avoid infinite loop when committing the badge.
    if: |
      github.event_name != 'push' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip coverage]')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage badge
        run: npm run coverage:badge

      - name: Upload coverage artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Commit updated badge (pushes only)
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- coverage-badge.svg; then
            echo "coverage-badge.svg unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-badge.svg
          git commit -m "chore: update coverage badge [skip coverage]"
          git push

